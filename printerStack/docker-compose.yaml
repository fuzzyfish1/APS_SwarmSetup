configs:
    mainsailConfig0:
        file: ./mainSailConfigs/config0.json
    mainsailConfig1:
        file: ./mainSailConfigs/config1.json
    mainsailConfig2:
        file: ./mainSailConfigs/config2.json
    mainsailConfig3:
        file: ./mainSailConfigs/config3.json
    mainsailConfig4:
        file: ./mainSailConfigs/config4.json
