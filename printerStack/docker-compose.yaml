version: "3.8"

services:
    mainsailP0:
        image: ghcr.io/mainsail-crew/mainsail:latest
        ports:
            - "8080:8080"
        configs:
            - source: mainsailConfig0
              target: /usr/share/nginx/html/config.json
        deploy:
            replicas: 1

    mainsailP1:
        image: ghcr.io/mainsail-crew/mainsail:latest
        ports:
            - "8081:8080"
        configs:
            - source: mainsailConfig1
              target: /usr/share/nginx/html/config.json
        deploy:
            replicas: 1
            
    mainsailP2:
        image: ghcr.io/mainsail-crew/mainsail:latest
        ports:
            - "8082:8080"
        configs:
            - source: mainsailConfig2
              target: /usr/share/nginx/html/config.json
        deploy:
            replicas: 1

